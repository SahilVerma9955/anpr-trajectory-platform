project:
  name: anpr-trajectory-platform
  version: 0.1.0
  environment: local
  debug: true

server:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

storage:
  database_url: sqlite:///./data/processed/anpr.db
  sqlite_path: data/processed/anpr.db

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  frames_dir: data/frames
  outputs_dir: data/outputs
  sample_dir: data/sample
  models_dir: models

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"
